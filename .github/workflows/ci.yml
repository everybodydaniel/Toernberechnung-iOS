# ──────────────────────────────────────────────────────────────
# GitHub Actions – automatische Prüfung von Toernberechnung iOS
# ──────────────────────────────────────────────────────────────
# Auslöser: Push und Pull Request auf main
# Aufgaben: 1. SwiftLint   2. Erstellen, Tests und Testabdeckung   3. Oberflächentests (XCUITest)   4. SonarCloud   5. DocC
# ──────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  XCODE_PROJECT: Toernberechnung.xcodeproj
  XCODE_SCHEME: Toernberechnung

jobs:

  # ────────────────────────────────────────────
  # 1. Statische Code-Analyse (Lint)
  # ────────────────────────────────────────────
  swiftlint:
    name: 🧹 SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  # ────────────────────────────────────────────
  # 2. Erstellen, Komponententests und Testabdeckung
  # ────────────────────────────────────────────
  build-and-test:
    name: 🏗️ Build, Test & Coverage
    runs-on: macos-latest
    needs: swiftlint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Boot Simulator
        run: |
          # Verfügbaren iPhone-Simulator ermitteln und starten
          SIMULATOR_UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted(devices, key=lambda key: tuple(map(int, re.findall(r"\d+", key))), reverse=True)
          print(next(device["udid"] for runtime in runtimes if "iOS" in runtime
                     for device in devices[runtime] if device["name"].startswith("iPhone") and device["isAvailable"]))
          ')
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run Unit Tests (with Coverage)
        run: |
          set -o pipefail
          mkdir -p build/test-results
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/test-results/unit-tests.xcresult \
            -enableCodeCoverage YES \
            -only-testing:ToernberechnungTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee build/test-results/unit-tests.log

      - name: Generate Coverage Reports (Cobertura + SonarQube + HTML)
        run: |
          bundle exec slather coverage \
            --build-directory build/DerivedData --scheme "$XCODE_SCHEME" \
            --output-directory build/coverage/cobertura --cobertura-xml "$XCODE_PROJECT"
          bundle exec slather coverage \
            --build-directory build/DerivedData --scheme "$XCODE_SCHEME" \
            --output-directory build/coverage/sonarqube --sonarqube-xml "$XCODE_PROJECT"
          bundle exec slather coverage \
            --build-directory build/DerivedData --scheme "$XCODE_SCHEME" \
            --output-directory build/coverage/html --html "$XCODE_PROJECT"

      - name: Debug – List Coverage Files
        if: always()
        run: |
          echo "=== Contents of build/coverage/ ==="
          find build/coverage/ -type f 2>/dev/null || echo "Directory not found"

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-test-results
          path: build/test-results/
          retention-days: 14

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-reports
          path: build/coverage/
          retention-days: 30

      - name: Upload XCResult Bundle (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xcresult-bundle
          path: build/test-results/*.xcresult
          retention-days: 7

  # ────────────────────────────────────────────
  # 3. GUI-Tests (XCUITest)
  #    Bei Bedarf mit der Repository-Variable UI_TESTS_DISABLED=true deaktivieren.
  # ────────────────────────────────────────────
  ui-tests:
    name: 📱 UI Tests (XCUITest)
    runs-on: macos-latest
    needs: swiftlint
    if: ${{ vars.UI_TESTS_DISABLED != 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Boot Simulator
        run: |
          # Verfügbaren iPhone-Simulator ermitteln und starten
          SIMULATOR_UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted(devices, key=lambda key: tuple(map(int, re.findall(r"\d+", key))), reverse=True)
          print(next(device["udid"] for runtime in runtimes if "iOS" in runtime
                     for device in devices[runtime] if device["name"].startswith("iPhone") and device["isAvailable"]))
          ')
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run UI Tests
        run: |
          set -o pipefail
          mkdir -p build/ui-test-results
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme ToernberechnungUITests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ui-test-results/ui-tests.xcresult \
            -only-testing:ToernberechnungUITests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee build/ui-test-results/ui-tests.log

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-test-results
          path: build/ui-test-results/
          retention-days: 14

  # ────────────────────────────────────────────
  # 4. SonarCloud (Codequalität und Testabdeckung)
  # ────────────────────────────────────────────
  sonarcloud:
    name: 📊 SonarCloud Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Download Coverage Reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: coverage-reports
          path: build/coverage/

      - name: Debug – List Downloaded Coverage Files
        run: |
          echo "=== Contents of build/coverage/ ==="
          find build/coverage/ -type f 2>/dev/null || echo "Directory not found"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ────────────────────────────────────────────
  # 5. DocC veröffentlichen (GitHub Pages)
  # ────────────────────────────────────────────
  deploy-docs:
    name: 📚 Deploy DocC
    runs-on: macos-latest
    needs: build-and-test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build DocC
        run: |
          xcodebuild docbuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -derivedDataPath /tmp/docbuild \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            DOCC_EXTRACT_EXTENSION_API=YES \
            DOCC_EXTRACT_API=YES \
            OTHER_DOCC_FLAGS="--transform-for-static-hosting --hosting-base-path Toernberechnung-iOS"

      - name: Prepare Pages Artifact
        run: |
          ARCHIVE_PATH=$(find /tmp/docbuild -type d -name "*.doccarchive" | head -n 1)
          if [ -z "$ARCHIVE_PATH" ]; then
            echo "Error: Could not find .doccarchive directory!"
            exit 1
          fi
          echo "Found archive at $ARCHIVE_PATH"
          mkdir -p ./docs-out
          cp -R "$ARCHIVE_PATH/" ./docs-out/
          cp ./site/datenschutz.html ./docs-out/datenschutz.html

      - name: Download Coverage Reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: coverage-reports
          path: ./docs-out/temp-coverage-reports

      - name: Align Coverage Reports Path
        run: |
          mkdir -p ./docs-out/coverage
          cp -R ./docs-out/temp-coverage-reports/html/* ./docs-out/coverage/
          rm -rf ./docs-out/temp-coverage-reports

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./docs-out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
