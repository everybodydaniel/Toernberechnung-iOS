name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  swiftlint:
    name: 🧹 SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  build-and-test:
    name: 🏗️ Build & Test
    runs-on: macos-latest
    needs: swiftlint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Toernberechnung.xcodeproj \
            -scheme Toernberechnung

      - name: Build Project
        run: |
          xcodebuild build \
            -project Toernberechnung.xcodeproj \
            -scheme Toernberechnung \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project Toernberechnung.xcodeproj \
            -scheme Toernberechnung \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -enableCodeCoverage YES \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/reports/Toernberechnung.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --report junit

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results
          path: build/reports/
          retention-days: 14

      - name: Install Slather
        run: gem install slather --no-document

      - name: Generate Coverage Report
        run: |
          slather coverage \
            --cobertura-xml \
            --sonarqube-xml \
            --html \
            --output-directory coverage \
            --scheme Toernberechnung \
            --binary-basename Toernberechnung \
            --build-directory build/DerivedData \
            Toernberechnung.xcodeproj

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Summarize Coverage
        if: github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        with:
          filename: coverage/cobertura.xml
          format: markdown
          output: both
          badge: true
          hide_complexity: true
          indicators: true
          thresholds: '60 80'

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728
        with:
          header: coverage
          recreate: true
          path: code-coverage-results.md

  sonarcloud:
    name: 📊 SonarCloud Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Download Test Results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: test-results
          path: build/reports/

      - name: Download Coverage Report
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: coverage-report
          path: coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  deploy-docs:
    name: 📚 Deploy DocC
    runs-on: macos-latest
    needs: build-and-test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Toernberechnung.xcodeproj \
            -scheme Toernberechnung

      - name: Build DocC
        run: |
          xcodebuild docbuild \
            -project Toernberechnung.xcodeproj \
            -scheme Toernberechnung \
            -derivedDataPath /tmp/docbuild \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            DOCC_EXTRACT_EXTENSION_API=YES \
            DOCC_EXTRACT_API=YES \
            OTHER_DOCC_FLAGS="--transform-for-static-hosting --hosting-base-path Toernberechnung-iOS"

      - name: Prepare Pages Artifact
        run: |
          ARCHIVE_PATH=$(find /tmp/docbuild -type d -name "*.doccarchive" | head -n 1)
          if [ -z "$ARCHIVE_PATH" ]; then
            echo "Error: Could not find .doccarchive directory!"
            exit 1
          fi
          echo "Found archive at $ARCHIVE_PATH"
          mkdir -p ./docs-out
          cp -R "$ARCHIVE_PATH/" ./docs-out/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./docs-out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e