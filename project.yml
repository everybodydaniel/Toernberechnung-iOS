name: Toernberechnung
options:
  bundleIdPrefix: com.toernberechnung
  minimumXcodeGenVersion: "2.30"
  groupSortPosition: top

targets:
  Toernberechnung:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Toernberechnung/ToernberechnungApp.swift
      - path: Toernberechnung/Views/ContentView.swift
      - path: Toernberechnung/Views/ContentView+MapTab.swift
      - path: Toernberechnung/Views/ContentView+SharedUI.swift
      - path: Toernberechnung/Views/ContentView+FloatingTabBar.swift
      - path: Toernberechnung/Views/ContentView+Weather.swift
      - path: Toernberechnung/Views/WeatherDetailViews.swift
      - path: Toernberechnung/Views/ContentView+Tides.swift
      - path: Toernberechnung/Views/ContentView+Nauti.swift
      - path: Toernberechnung/Views/ContentView+NautiDrawer.swift
      - path: Toernberechnung/Views/ContentView+Crew.swift
      - path: Toernberechnung/Views/CrewPlanningView.swift
      - path: Toernberechnung/Views/CrewEventEditor.swift
      - path: Toernberechnung/Views/CrewEventShareView.swift
      - path: Toernberechnung/Engine/CrewCalendarExport.swift
      - path: Toernberechnung/Views/ContentView+Logbook.swift
      - path: Toernberechnung/Views/ContentView+InitialData.swift
      - path: Toernberechnung/Views/MapView.swift
      - path: Toernberechnung/Views/FullScreenNavigationView.swift
      - path: Toernberechnung/Views/WebView.swift
      - path: Toernberechnung/Views/LiquidGlassStyle.swift
      - path: Toernberechnung/Views/KeyboardDismissal.swift
      - path: Toernberechnung/Views/MeasurementTextField.swift
      - path: Toernberechnung/Views/NautiChatView.swift
      - path: Toernberechnung/Views/NautiPremiumChatView.swift
      - path: Toernberechnung/Views/MaritimeWarningsSheetView.swift
      - path: Toernberechnung/Engine/AppDateFormatters.swift
      - path: Toernberechnung/Engine/HarbourCatalog.swift
      - path: Toernberechnung/Engine/MarineWeatherModels.swift
      - path: Toernberechnung/Engine/MaritimeWarningModels.swift
      - path: Toernberechnung/Engine/NautiModels.swift
      - path: Toernberechnung/Engine/NautiDeterministicIntentRouter.swift
      - path: Toernberechnung/Engine/NautiChatViewModel.swift
      - path: Toernberechnung/Engine/RoutePlanModels.swift
      - path: Toernberechnung/Engine/AstronomicalTideCurve.swift
      - path: Toernberechnung/Engine/SurveyedDepthCatalog.swift
      - path: Toernberechnung/Engine/TidalHeightStrategy.swift
      - path: Toernberechnung/Engine/WaypointDepthSolver.swift
      - path: Toernberechnung/Engine/RouteCalculationService.swift
      - path: Toernberechnung/Engine/RouteSummary.swift
      - path: Toernberechnung/Engine/PassageWindowScanner.swift
      - path: Toernberechnung/Engine/PassageWindowSolver.swift
      - path: Toernberechnung/Engine/WaypointTideContext.swift
      - path: Toernberechnung/Engine/WaddenSeaCatalog.swift
      - path: Toernberechnung/Engine/RoutePlannerViewModel.swift
      - path: Toernberechnung/Engine/RoutePlannerViewModel+Support.swift
      - path: Toernberechnung/Engine/NauticalRouter.swift
      - path: Toernberechnung/Engine/ProtectedZoneCatalog.swift
      - path: Toernberechnung/Engine/RouteExpander.swift
      - path: Toernberechnung/Engine/NavigationTracker.swift
      - path: Toernberechnung/Engine/ActiveVoyageManager.swift
      - path: Toernberechnung/Engine/Routing
      - path: Toernberechnung/Services/LocationService.swift
      - path: Toernberechnung/Services/WeatherKitManager.swift
      - path: Toernberechnung/Services/LocalAIInferenceManager.swift
      - path: Toernberechnung/Services/NautiConversationRepository.swift
      - path: Toernberechnung/Services/BSHTideService.swift
      - path: Toernberechnung/Services/BSHWaterLevelForecastService.swift
      - path: Toernberechnung/Services/WaterLevelCorrectionSeries.swift
      - path: Toernberechnung/Services/TideDataProvider.swift
      - path: Toernberechnung/Services/MaritimeWarningsService.swift
      - path: Toernberechnung/Services/BSHNauticalWarningsParser.swift
      - path: Toernberechnung/Resources/wadden_sea_catalog.json
        type: file
        buildPhase: resources
      - path: Toernberechnung/Resources/nordsbefv_eastfrisia.geojson
        type: file
        buildPhase: resources
      - path: Toernberechnung/Resources/east_frisia.geojson
        type: file
        buildPhase: resources
      - path: Toernberechnung/Resources/east_frisia_osm.geojson
        type: file
        buildPhase: resources
      - path: Toernberechnung/Resources/nordsbefv.geojson
        type: file
        buildPhase: resources
      - path: Toernberechnung/Resources/Assets.xcassets
        type: folder.assetcatalog
        buildPhase: resources
      - path: Toernberechnung/Resources/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
      - path: Toernberechnung/Info.plist
        type: file
        buildPhase: none
      - path: Toernberechnung/Toernberechnung.docc
    preBuildScripts:
      - name: CleanSourceAttributes
        script: |
          xattr -cr "${SRCROOT}/Toernberechnung" 2>/dev/null || true
          xattr -cr "${SRCROOT}/ToernberechnungTests" 2>/dev/null || true
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: CleanExtendedAttributes
        script: |
          xattr -cr "${BUILT_PRODUCTS_DIR}" 2>/dev/null || true
          xattr -cr "${TARGET_BUILD_DIR}" 2>/dev/null || true
        basedOnDependencyAnalysis: false
      - name: SwiftLint
        inputFiles:
          - $(SRCROOT)/.swiftlint.yml
          - $(SRCROOT)/Toernberechnung
          - $(SRCROOT)/ToernberechnungTests
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint ist nicht installiert. Bitte 'brew install swiftlint' ausführen."
          fi
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: CleanAppBundleAttributes
        script: |
          xattr -cr "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}" 2>/dev/null || true
          xattr -cr "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" 2>/dev/null || true
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toernberechnung.ios
        INFOPLIST_FILE: Toernberechnung/Info.plist
        CODE_SIGN_ENTITLEMENTS: Toernberechnung/Toernberechnung.entitlements
        DEVELOPMENT_TEAM: L9T7RPMW5H
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "1.1.0"
    scheme:
      gatherCoverageData: true
      testTargets:
        - ToernberechnungTests
        - ToernberechnungUITests

  ToernberechnungTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ToernberechnungTests
      - path: Toernberechnung/Resources/wadden_sea_catalog.json
        type: file
        buildPhase: resources
    dependencies:
      - target: Toernberechnung
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toernberechnung.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
    postCompileScripts:
      - name: CleanExtendedAttributes
        script: |
          xattr -cr "${BUILT_PRODUCTS_DIR}" 2>/dev/null || true
          xattr -cr "${TARGET_BUILD_DIR}" 2>/dev/null || true
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - ToernberechnungTests

  ToernberechnungUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ToernberechnungUITests
    dependencies:
      - target: Toernberechnung
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toernberechnung.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Toernberechnung
    scheme:
      testTargets:
        - ToernberechnungUITests
