name: Toernberechnung
options:
  bundleIdPrefix: com.toernberechnung
  minimumXcodeGenVersion: "2.30"
  groupSortPosition: top

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.26.0

targets:
  Toernberechnung:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Toernberechnung/ToernberechnungApp.swift
      - path: Toernberechnung/Views/ContentView.swift
      - path: Toernberechnung/Views/ContentView+MapTab.swift
      - path: Toernberechnung/Views/CalculatorResultsSection.swift
      - path: Toernberechnung/Views/ContentView+SharedUI.swift
      - path: Toernberechnung/Views/ContentView+Weather.swift
      - path: Toernberechnung/Views/ContentView+Tides.swift
      - path: Toernberechnung/Views/ContentView+Crew.swift
      - path: Toernberechnung/Views/ContentView+Logbook.swift
      - path: Toernberechnung/Views/ContentView+InitialData.swift
      - path: Toernberechnung/Views/ContentView+RouteDetail.swift
      - path: Toernberechnung/Views/MapView.swift
      - path: Toernberechnung/Views/FullScreenNavigationView.swift
      - path: Toernberechnung/Views/FullScreenMapView.swift
      - path: Toernberechnung/Views/WebView.swift
      - path: Toernberechnung/Views/LiquidGlassStyle.swift
      - path: Toernberechnung/Engine/AppDateFormatters.swift
      - path: Toernberechnung/Engine/RoutePlanModels.swift
      - path: Toernberechnung/Engine/TidalHeightStrategy.swift
      - path: Toernberechnung/Engine/RuleOfTwelfths.swift
      - path: Toernberechnung/Engine/RouteCalculationService.swift
      - path: Toernberechnung/Engine/RouteSummary.swift
      - path: Toernberechnung/Engine/PassageWindowScanner.swift
      - path: Toernberechnung/Engine/WaddenSeaCatalog.swift
      - path: Toernberechnung/Engine/RoutePlannerViewModel.swift
      - path: Toernberechnung/Engine/SeaRoutePlanner.swift
      - path: Toernberechnung/Engine/NauticalRouter.swift
      - path: Toernberechnung/Engine/ProtectedZoneCatalog.swift
      - path: Toernberechnung/Engine/RouteExpander.swift
      - path: Toernberechnung/Engine/NavigationTracker.swift
      - path: Toernberechnung/Engine/ActiveVoyageManager.swift
      - path: Toernberechnung/Engine/Routing
      - path: Toernberechnung/Services/LocationService.swift
      - path: Toernberechnung/Services/DWDService.swift
      - path: Toernberechnung/Services/DWDSeewetterService.swift
      - path: Toernberechnung/Services/BSHTideService.swift
      - path: Toernberechnung/Services/BSHWaterLevelService.swift
      - path: Toernberechnung/Services/BSHWaterLevelForecastService.swift
      - path: Toernberechnung/Services/WattseglerLotungenService.swift
      - path: Toernberechnung/Services/EmdenPlantabelleService.swift
      - path: Toernberechnung/Services/WindfinderService.swift
      - path: Toernberechnung/Services/TideDataProvider.swift
      - path: Toernberechnung/Resources/wadden_sea_catalog.json
        type: file
        buildPhase: resources
      - path: Toernberechnung/Resources/nordsbefv_eastfrisia.geojson
        type: file
        buildPhase: resources
      - path: Toernberechnung/Resources/east_frisia.geojson
        type: file
        buildPhase: resources
      - path: Toernberechnung/Resources/east_frisia_osm.geojson
        type: file
        buildPhase: resources
      - path: Toernberechnung/Resources/nordsbefv.geojson
        type: file
        buildPhase: resources
      - path: Toernberechnung/Info.plist
        type: file
        buildPhase: none
      - path: Toernberechnung/Toernberechnung.docc
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: MapLibre
        product: MapLibre
    postCompileScripts:
      - name: SwiftLint
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint ist nicht installiert. Bitte 'brew install swiftlint' ausführen."
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toernberechnung.ios
        INFOPLIST_FILE: Toernberechnung/Info.plist
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    scheme:
      gatherCoverageData: true
      testTargets:
        - ToernberechnungTests
        - ToernberechnungUITests

  ToernberechnungTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ToernberechnungTests
      - path: Toernberechnung/Resources/wadden_sea_catalog.json
        type: file
        buildPhase: resources
    dependencies:
      - target: Toernberechnung
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toernberechnung.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - ToernberechnungTests

  ToernberechnungUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ToernberechnungUITests
    dependencies:
      - target: Toernberechnung
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toernberechnung.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Toernberechnung
    scheme:
      testTargets:
        - ToernberechnungUITests


