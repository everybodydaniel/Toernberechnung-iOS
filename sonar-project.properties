sonar.projectKey=everybodydaniel_Toernberechnung-iOS
sonar.organization=everybodydaniel

# Quellen und Tests
sonar.sources=Toernberechnung
sonar.tests=ToernberechnungTests

# Coverage-Report von Slather (siehe .github/workflows/ci.yml)
sonar.coverageReportPaths=coverage/sonarqube-generic-coverage.xml

# Coverage-Exklusionen mit Begruendung
#
# Diese Pfade werden bewusst aus der Coverage-Berechnung ausgeschlossen.
# Die Quality-Gate-Schwelle von 80 % bezieht sich damit ausschliesslich
# auf die fachliche Geschaeftslogik in Engine und in den Provider-Adaptern,
# fuer die isolierte Unit-Tests sinnvoll sind.
#
# - Views/**:            deklarative SwiftUI-Views. Werden manuell ueber den
#                        GUI-Testplan (docs/Testdokumentation.docx, Kapitel 7)
#                        abgesichert, nicht via XCTest.
# - ToernberechnungApp:  SwiftUI-Entry-Point ohne sinnvolle Unit-Testfaehigkeit.
# - DWDService:          URLSession-/KMZ-Parser. Wird hinter dem Protokoll
#                        WeatherDataProvider gekapselt und ueber den
#                        MockWeatherDataProvider in Unit-Tests ersetzt.
# - BSHTideService:      URLSession-/JSON-Parser. Wird hinter dem Protokoll
#                        TideDataProvider gekapselt und ueber den
#                        MockTideDataProvider in Unit-Tests ersetzt.
sonar.coverage.exclusions=\
    Toernberechnung/Views/**,\
    Toernberechnung/ToernberechnungApp.swift,\
    Toernberechnung/Services/DWDService.swift,\
    Toernberechnung/Services/BSHTideService.swift

# Generierte Ressourcen aus der Analyse herausnehmen
sonar.exclusions=\
    Toernberechnung/Resources/**,\
    Toernberechnung/Toernberechnung.docc/**,\
    docs/**

sonar.swift.file.suffixes=.swift
sonar.sourceEncoding=UTF-8
