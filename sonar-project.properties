# ──────────────────────────────────────────────
# SonarCloud Configuration – Toernberechnung iOS
# ──────────────────────────────────────────────
sonar.projectKey=everybodydaniel_Toernberechnung-iOS
sonar.organization=everybodydaniel
sonar.host.url=https://sonarcloud.io
sonar.verbose=true


# Source layout
sonar.sources=Toernberechnung
sonar.tests=ToernberechnungTests
sonar.swift.file.suffixes=.swift
sonar.sourceEncoding=UTF-8

# Coverage report (SonarQube Generic Test Coverage XML – erzeugt von Slather)
sonar.coverageReportPaths=build/coverage/sonarqube/sonarqube-generic-coverage.xml


# Vom Coverage-Quality-Gate ausgenommen
#   – SwiftUI-Views werden über XCUITest abgedeckt, nicht über Unit-Tests
#   – Resources/DocC/App-Bootstrap sind keine sinnvoll testbaren Codezeilen
sonar.coverage.exclusions=**/Views/**, \
                          **/MapView.swift, \
                          **/ToernberechnungApp.swift, \
                          **/*.docc/**, \
                          **/Resources/**

# Generelle Analyse-Exclusions (Generated/Build/Fixtures)
sonar.exclusions=**/build/**, \
                 **/DerivedData/**, \
                 **/*.generated.swift, \
                 ToernberechnungTests/Fixtures/**, \
                 ToernberechnungTests/Mocks/**
