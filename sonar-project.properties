# ──────────────────────────────────────────────
# SonarCloud-Konfiguration für Toernberechnung iOS
# ──────────────────────────────────────────────
sonar.projectKey=everybodydaniel_Toernberechnung-iOS
sonar.organization=everybodydaniel
sonar.host.url=https://sonarcloud.io
sonar.verbose=true


# Aufteilung der Quelldateien
sonar.sources=Toernberechnung
sonar.tests=ToernberechnungTests
sonar.swift.file.suffixes=.swift
sonar.sourceEncoding=UTF-8

# Bericht zur Testabdeckung im SonarQube-XML-Format, erzeugt von Slather
sonar.coverageReportPaths=build/coverage/sonarqube/sonarqube-generic-coverage.xml


# Von den Qualitätsgrenzen der Testabdeckung ausgenommen
#   – SwiftUI-Ansichten werden mit XCUITest statt mit Komponententests geprüft
#   – Ressourcen, DocC und App-Start enthalten keine sinnvoll einzeln testbaren Codezeilen
sonar.coverage.exclusions=**/Views/**, \
                          **/MapView.swift, \
                          **/ToernberechnungApp.swift, \
                          **/*.docc/**, \
                          **/Resources/**

# Allgemeine Analyseausnahmen: erzeugte Dateien, Build-Ausgaben und Testdaten
sonar.exclusions=**/build/**, \
                 **/DerivedData/**, \
                 **/*.generated.swift, \
                 ToernberechnungTests/Fixtures/**, \
                 ToernberechnungTests/Mocks/**
